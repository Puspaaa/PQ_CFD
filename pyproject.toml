[project]
name = "pq-cfd"
version = "0.1.0"
description = "Classical LBM baselines for a stepwise quantum CFD research project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pq_cfd"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
